# Cấu hình Cloudflare Pages cho Thiệp Hồng
# https://developers.cloudflare.com/pages/functions/wrangler-configuration/
name = "thiephong"
pages_build_output_dir = "./dist"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_NAME = "Thiệp Hồng"

# D1 database. database_id thật sẽ được điền ở Phase 0b (sau khi tạo DB trên Cloudflare).
# Ở local, wrangler giả lập D1 trong .wrangler/state nên id nào cũng được.
[[d1_databases]]
binding = "DB"
database_name = "thiephong-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# R2 bucket chứa ảnh / nhạc
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "thiephong-media"
