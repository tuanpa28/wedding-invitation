# Postgres cho môi trường local. Production dùng Neon (Postgres trên cloud).
services:
  postgres:
    image: postgres:17-alpine
    container_name: thiephong-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: thiephong
      POSTGRES_PASSWORD: thiephong
      POSTGRES_DB: thiephong
    ports:
      - '5434:5432'
    volumes:
      - thiephong-pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U thiephong -d thiephong']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  thiephong-pgdata:
